packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
  # koffi's install script is a source-build fallback; the binary ships in the
  # @koromix/koffi-<platform> optional dependency and loads without it.
  koffi: false
onlyBuiltDependencies:
  - esbuild
overrides:
  '@kaicreator/domain-harness-build': file:packages/download-domain-app/vendor/sdk/kaicreator-domain-harness-build-0.10.2-rc.0.tgz
  '@kaicreator/domain-harness-contracts': file:packages/download-domain-app/vendor/sdk/kaicreator-domain-harness-contracts-0.10.2-rc.0.tgz
  '@kaicreator/domain-harness-host-node': file:packages/download-domain-app/vendor/sdk/kaicreator-domain-harness-host-node-0.10.2-rc.0.tgz
  '@kaicreator/domain-harness-microkernel': file:packages/download-domain-app/vendor/sdk/kaicreator-domain-harness-microkernel-0.10.2-rc.0.tgz
