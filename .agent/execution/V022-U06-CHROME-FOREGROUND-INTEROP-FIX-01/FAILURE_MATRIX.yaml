failures:
  - id: "F-BASELINE"
    trigger: "WIP HEAD differs from the Owner-approved exact base or claim binds to another SHA."
    disposition: "STOP; re-read refs and obtain a fresh exact-base authorization."
  - id: "F-WRITESET"
    trigger: "Any source change outside chrome-toolbar-active-tab.mjs is needed."
    disposition: "STOP; request separate Owner scope amendment; do not widen this Task."
  - id: "F-INTEROP"
    trigger: "PowerShell interop declaration still fails or GetForegroundWindow is not callable."
    disposition: "Repair only inside the frozen one-file write set; preserve first failure evidence."
  - id: "F-PRIVACY"
    trigger: "Chrome foreground/occlusion cannot be proven."
    disposition: "Skip screenshot with explicit reason; never capture full desktop."
  - id: "F-LOCKED"
    trigger: "Windows desktop is locked or native input cannot reach Chrome."
    disposition: "Record grant as NOT_RUN; do not use direct popup/CDP fallback."
  - id: "F-CI"
    trigger: "Node24 syntax, Prettier, typecheck, ci:verify or Woodpecker fails."
    disposition: "Preserve exact SHA and first failure; repair only in frozen one-file write set."
