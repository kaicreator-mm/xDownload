task_id: T007
base_sha: c813d3a1f2afea7bd3f99de1d01321904f5fbdd5
status: specification-only-not-run-by-jit-prep

failures:
  - id: task-pack-defect
    trigger: Frozen T007 Task Pack is incomplete or contradicts higher Product/Task-DAG authority
    classification: TASK_PACK_DEFECT
    required_action:
      - stop affected implementation path
      - publish durable evidence to the owning authority
      - do not redesign Product/Task scope locally
    false_pass_forbidden: true

  - id: architecture-contradiction
    trigger: satisfying T007 would require violating Frozen L2 ownership, authority or trust boundaries (e.g. evidence/result truth moved outside Core, per-surface derivation introduced)
    classification: ARCHITECTURE_CONTRADICTION
    required_action:
      - stop affected implementation path
      - route through ADS Architecture Amendment/new-material-UNKNOWN process
      - do not weaken invariants in code or tests
    false_pass_forbidden: true

  - id: execution-pack-invalid
    trigger: wrong task/base/branch/task-pack/ADS pin, missing or duplicate core artifact, or pack contradicts higher authority
    classification: EXECUTION_PACK_INVALID
    required_action:
      - stop before implementation
      - regenerate or repair pack through an authorized JIT-prep action
    false_pass_forbidden: true

  - id: dependency-or-base-drift
    trigger: version/v0.1.0 no longer equals manifest base or T002 completion identity is no longer current
    classification: PACK_STALE_MATERIAL_OR_REBIND_REQUIRED
    required_action:
      - re-read integration delta and dependency identities
      - classify under EXECUTION_PACK_STANDARD fail-closed rules
      - never silently rewrite base_sha
      - regenerate on material or unknown drift
    false_pass_forbidden: true

  - id: canonical-vocabulary-fork
    trigger: T007 redefines/forks T002-owned schemas, enums or legal-combination rules instead of consuming them
    classification: DOMAIN_AUTHORITY_REJECTED
    required_action:
      - consume the canonical domain-contracts vocabulary
      - extend only additively with explicit schema identity
      - route genuine vocabulary defects upward instead of patching locally
    false_pass_forbidden: true

  - id: malformed-ledger-input
    trigger: evidence/validation record is missing required fields, carries unknown authoritative enum values, or malformed identifiers/scope at ledger admission
    classification: DOMAIN_SCHEMA_REJECTED
    required_action:
      - reject before the record enters the authoritative ledger
      - return typed validation diagnostics without secret leakage
      - never coerce into a known claim type
    false_pass_forbidden: true

  - id: discovery-self-certification
    trigger: discovery-derived evidence is accepted as the sole oracle for the same semantic claim it derived
    classification: EVIDENCE_INDEPENDENCE_REJECTED
    required_action:
      - reject the validation path deterministically
      - require an independent evidence source for the claim
      - never relax independence semantics to unblock projection
    false_pass_forbidden: true

  - id: count-only-completeness
    trigger: VERIFIED_COMPLETE or any completeness claim is derived from count equality, limits, timeout, budget exhaustion, failed next page, pagination loop or unproven natural end
    classification: COMPLETENESS_EVIDENCE_REJECTED
    required_action:
      - reject the projection
      - require a PRD §19 sufficient basis with independent evidence
      - keep invalid states unrepresentable rather than filtered at display time
    false_pass_forbidden: true

  - id: empty-set-vacuous-success
    trigger: empty selected set or unproven-empty requested collection is projected as acquisition COMPLETE or verified empty
    classification: DOMAIN_INVARIANT_REJECTED
    required_action:
      - project the §18.5/§18.6 frozen tuples exactly
      - reject vacuous acquisition success deterministically
    false_pass_forbidden: true

  - id: accessible-subset-substitution
    trigger: RequestFulfillmentStatus or authoritative CoverageStatus is computed relative to the accessible/authorized subset, or AuthorizationContextRef redefines requested scope
    classification: SCOPE_MUTATION_REJECTED
    required_action:
      - compute fulfillment strictly against the original immutable requested scope
      - keep the three §17 coverage views distinct
      - reject the substitution deterministically
    false_pass_forbidden: true

  - id: invalid-result-projection
    trigger: projector emits a §18.8 forbidden combination or normalizes an invalid state into the nearest legal status
    classification: DOMAIN_INVARIANT_REJECTED
    required_action:
      - reject deterministically and identify the violated rule
      - do not clamp, default or repair statuses into success
    false_pass_forbidden: true

  - id: cancellation-cutoff-violation
    trigger: recovery/reconciliation auto-accepts bytes across the durable-cancellation cutoff, or cancellation is projected to fabricate/erase fulfillment truth
    classification: TERMINAL_TRUTH_REJECTED
    required_action:
      - enforce the L2 §11.1 acceptance-cutoff projection rules
      - project CANCELLED/PARTIAL/COMPLETE per durable acceptance facts only
      - route contradiction upward if the cutoff cannot be represented
    false_pass_forbidden: true

  - id: ledger-mutation
    trigger: accepted evidence records are rewritten, deleted or silently replaced; terminal results mutate after projection
    classification: LEDGER_MUTATION_REJECTED
    required_action:
      - enforce append-only semantics with new-record corrections
      - treat terminal results as immutable once projected within T007 semantics
    false_pass_forbidden: true

  - id: confirmation-overreach
    trigger: user confirmation is projected as QUALITY/target validation PASS or as waiving Transfer/Format/Media validation
    classification: CLAIM_BINDING_REJECTED
    required_action:
      - bind confirmation to exactly the shown claim (whatConfirmationProves semantics)
      - keep required validation layers mandatory regardless of confirmation
    false_pass_forbidden: true

  - id: surface-authority-leak
    trigger: a surface reads more than a thin projection, recomputes status locally, or T007 implements Desktop/CLI/Browser product behavior
    classification: AUTHORITY_BOUNDARY_REJECTED
    required_action:
      - keep read projections non-authoritative
      - move surface behavior out of T007 scope
    false_pass_forbidden: true

  - id: incomplete-oracle-mapping
    trigger: any C01-C34 Product counterexample lacks a projection/behavior-level T007 test oracle, or a required suite is not executable
    classification: T007_VALIDATION_INCOMPLETE
    required_action:
      - keep concern Validation non-PASS
      - add bounded semantic-layer representation/test only
      - do not implement downstream product behavior to close the gap
    false_pass_forbidden: true

  - id: test-tooling-failure
    trigger: install/typecheck/lint/unit/projection test cannot execute, crashes, times out, or has unavailable required tooling
    classification: VALIDATION_NOT_EXECUTED
    required_action:
      - record exact command/environment/failure
      - distinguish infrastructure/tooling failure from product failure
      - never report PASS from an unexecuted or partial gate
    false_pass_forbidden: true

  - id: new-dependency-license-unknown
    trigger: Builder proposes a new runtime dependency without exact version and license/provenance verification
    classification: EXECUTION_EVIDENCE_INCOMPLETE
    required_action:
      - do not treat dependency choice as accepted
      - record exact package/version/license and primary source before merge candidate qualification
      - keep choice within F1 and Frozen Architecture
    false_pass_forbidden: true
