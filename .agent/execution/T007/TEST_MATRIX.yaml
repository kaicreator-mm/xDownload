  - id: C28
    scenario: discovery-budget-exhausted-hls-target-needs-segments
    t007_oracle: budget-domain facts project DISCOVERY_BUDGET_EXHAUSTED without blocking frozen-target transfer while Transfer/GlobalSafety budgets remain
  - id: C29
    scenario: current-page-attachment-redirects-to-declared-cdn
    t007_oracle: provenance-bound locator transition evidence preserves logical target through projection; unrelated redirect evidence fails target validation
  - id: C30
    scenario: fifty-item-confirmations-vs-batch-selection
    t007_oracle: batch/manual selection claims bind the whole selected set in the ledger; projection requires no per-item authority objects
  - id: C31
    scenario: prior-12-of-18-selection-reused-on-different-page
    t007_oracle: task-local selection evidence cannot satisfy membership claims on another task without promoted validated knowledge provenance
  - id: C32
    scenario: gate-set-includes-failure-abandonment-unknown-out-of-scope
    t007_oracle: projector preserves distinct FAILED/ABANDONED/UNKNOWN/OUT_OF_SCOPE classification; no generic success collapse
  - id: C33
    scenario: phase-b-opened-then-protocol-or-baseline-changed
    t007_oracle: baseline/protocol identity change invalidates prior evidence binding; new independent run required before projection
  - id: C34
