failures:
  - id: "F-WRITESET"
    trigger: "A required source/test/config change falls outside the exact three-file write set."
    disposition: "STOP; TASK_PACK_DEFECT or scope amendment; no out-of-scope write."
  - id: "F-DISPATCH-PROFILE"
    trigger: "A Web executor attempts to claim as LOCAL_BUILDER, or a Local Builder omits the Owner-amended LOCAL_BUILDER/LOCAL profile."
    disposition: "BLOCKED; only an actual local executor may use the Owner-authorized LOCAL_BUILDER/LOCAL profile; never relabel a Web executor as Local."
  - id: "F-BASE-DRIFT"
    trigger: "Integration branch HEAD differs from manifest base SHA before implementation starts."
    disposition: "PACK_STALE_MATERIAL unless positive material-path analysis proves otherwise; regenerate/rebind only through authorized controller."
  - id: "F-CLAIM"
    trigger: "Missing, stale, duplicate or ambiguous Builder Claim."
    disposition: "STOP; no source mutation; re-read canonical GitHub facts."
  - id: "F-SCHEMA"
    trigger: "Unknown descriptor version/operation/field kind."
    disposition: "Fail closed; do not render or submit unsupported field."
  - id: "F-POLL-RACE"
    trigger: "Late response from an old poll generation or after terminal."
    disposition: "Ignore stale response; terminal state cannot regress."
  - id: "F-PERMISSION"
    trigger: "Chrome permission denied or missing page access."
    disposition: "Friendly localized explanation; exact diagnostic preserved; no auto-request or permission widening."
  - id: "F-CI"
    trigger: "Syntax/Prettier/typecheck/test/Woodpecker failure."
    disposition: "Preserve first failure and exact SHA; fix only within admitted write set; retry as a new immutable attempt."
  - id: "F-REVIEW"
    trigger: "Independent Exact-SHA review finds P0/P1 or material P2."
    disposition: "Changes requested; preserve findings; do not merge WIP integration."
