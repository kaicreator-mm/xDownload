  findings:
    - id: P1-01
      finding: >-
        The pinned-direct toolbar path bypassed the required UIA action-pattern
        gate: its dump-row filter and the u06-uia-click.ps1 selector rechecked
        only Name + ControlType + visibility + width, never required
        InvokePattern and never rejected TogglePattern / ExpandCollapsePattern,
        while the Extensions-menu helper (u06-uia-toolbar-action.ps1) enforced
        both pattern constraints.
      response: >-
        One shared exact action predicate (Test-U06ExtensionActionElement in
        u06-uia-click.ps1 and u06-uia-toolbar-action.ps1, mirrored Node-side as
        rowIsExtensionAction) now gates both mechanisms under identical clauses:
        exact manifest-derived name form, visible non-zero bounds, InvokePattern
        required, Toggle/ExpandCollapse rejected, exactly-one-or-NOT_RUN with
        zero input; foreground guard and no-fallback policy preserved.
      environment_fact: >-
        Chrome 153 zh-CN exposes the pinned toolbar button as ControlType.Button
        with ExpandCollapsePattern and no InvokePattern
        (grant-r8-9-diag/uia-before-toolbar.json), so the strict shared predicate
        truthfully yields zero direct-path candidates on this host and the
        genuine grant proceeds through the Extensions-menu mechanism under the
        SAME predicate (single-match and delivered guarded clicks proven in
        r8-6/r8-7). No input mechanism outside genuine guarded UIA was added.
      environment_fact_2: >-
        Chrome 153 zh-CN ALSO appends a dynamic per-site access hint suffix to
        the Extensions-menu action row's accessible Name ('xDownload Browser
        Integration、每次访问时都询问。选择即可更改网站权限' — evidence
        grant-r8-rr4/uia-extensions-menu.json; grant-r8-6/7 observed the bare
        name earlier the same day), so exact-equality could never match. The
        menu-row documented form is therefore the manifest action name as an
        ORDINAL PREFIX (optionally followed by Chrome's hint suffix), mirrored
        Node-side and PowerShell-side in the same shared predicate, verified
        against the rr4 dump: the suffixed action row uniquely matches (Invoke,
        no Toggle/ExpandCollapse) while the per-site toggle row ('允许在此网站上
        使用"…"'), the quote-prefixed more-options row, and the pinned button
        (different prefix, ExpandCollapse-only) all stay excluded. Exactly-one
        cardinality unchanged; predicate self-test extended to 19 cases.
    - id: P1-02
      finding: >-
        The shared PS_FOREGROUND_GUARD still called SetForegroundWindow on
        foreground mismatch and retried through AttachThreadInput plus another
        SetForegroundWindow attempt. This contradicted the manifest's explicit
        no-force-focus / no-forced-focus-activation boundary, even though mouse
        input itself remained gated by exact foreground readback.
      response: >-
        Reviewer repair removes SetForegroundWindow, AttachThreadInput and
        GetCurrentThreadId imports/calls from both generated click helpers.
        Assert-Foreground is now readback-only with a bounded 15-second
        operator-foreground wait; if the exact target HWND is not already
        foreground, it returns denied before cursor or mouse input. The
        foreground-guard self-test also audits the generated helpers for
        forbidden activation APIs. Exact HWND checks before each input and
        mouse-up cleanup remain unchanged.
    - id: P2-01
      finding: >-
        Contradictory/stale handoff metadata in this manifest: pre_ci said
        "two-path repair" and forbidden said "the two allowed_write_set files"
        against the three-path allowed_write_set, and status remained
        READY_FOR_GENERATION_8_CAS_CLAIM after generation 8 was claimed and the
        R8 repair was delivered.
      response: >-
        pre_ci and forbidden now reference the three allowed_write_set files;
        this review_response section records the claim/delivery/review chain and
        the status field below reflects the true post-review state.
    - id: P2-02
      finding: >-
        The harness-core.ts file-level fixture description said terminal
        injection occurs only after the real submit was ACCEPTED, while the
        implementation injects after the accepted EXECUTE_S1_DIRECT_ACQUISITION.
      response: >-
