required_suites:
  - id: harness-self-tests
    must_prove:
      - every shipped harness executes deterministically and offline on the exact candidate
      - harness outputs are stable across repeated runs for identical inputs
      - harness failure modes fail closed with typed diagnostics instead of silent partial results
      - no harness output is represented as Product gate truth
  - id: corpus-identity
    must_prove:
      - Natural/Collection/Hard/Holdout corpora (PRD §33) load with stable corpus and task-case identities
      - S1-S6 tagging of corpus cases matches the PRD §28 support-slice registry
      - mutating corpus content under a reused identity is detected and rejected
      - controlled fixtures/fixture servers are deterministic; no live-network truth is required
  - id: denominator-accounting
    must_prove:
      - sample unit is one end-to-end Acquisition task, not each downloaded file (PRD §32.1)
      - out-of-scope tasks are excluded from the primary success denominator but reported separately
      - UNKNOWN is not success and remains in denominator unless independent truth itself is unavailable (INSUFFICIENT_EVIDENCE)
      - abandonment caused by xDownload friction/failure is counted as non-success
      - external/unrelated cancellation is excluded only with a pre-recorded reason
      - repeated runs of the same unchanged task are not counted as independent sample units
      - classification error of scope membership counts against scope/UX correctness
  - id: baseline-pre-registration-enforcement
    must_prove:
      - G0BaselinePlan requires all PRD §32.2 fields before freeze (plan id, candidate registry, applicability, selection rule, comparison sets, baseline identity, aggregation rule, tie-break, frozen_at)
      - a frozen plan is immutable; mutation attempts are detected and rejected
      - non-deterministic or post-exposure baseline selection is rejected (PRD §32.2 steps 1-4, §33 Baseline rule R03)
      - fixed comparison sets require a pre-registered aggregation rule
      - baseline identity/config change after Phase B exposure is representable only as run invalidation requiring a new independent run (C33)
      - no API exists to add favorable baselines or rewrite selection criteria after exposure
  - id: evidence-exact-subject-binding
    must_prove:
      - captured evidence records carry claim_type, claim_subject, source identity/provenance, independence_from_discovery, scope and certainty class (PRD §20)
      - discovery/UI-suggestion provenance cannot be typed as independent truth for the same claim (PRD §22, C34)
      - user confirmation records prove only the shown/asked claim and cannot waive Transfer/Format/Media validation (PRD §21, C26/C27)
      - evidence formatting is deterministic and subject-exact (no merged/approximated subjects)
  - id: c01-c34-oracle-loading
    must_prove:
      - the C01-C34 oracle corpus loads completely: all 34 records parse, each with a known C-identity
      - each oracle binds expected product behavior/status tuples to the canonical result vocabulary from @xdownload/domain-contracts
      - each oracle carries pre-registered expectation metadata (target, scope, expected stop, truth source) per PRD §35 preamble
      - records referencing unknown C-identities, unknown canonical statuses, or self-generated truth sources fail closed
      - oracle execution against a product candidate is not part of this task and remains NOT_RUN
  - id: critical-journey-harness
    must_prove:
      - CJ-01 through CJ-09 (PRD §31) each have a harness definition with pre-registered expectations
      - journey definitions reference corpus task-case identities and required support slices without implementing product behavior
      - journey definitions cannot silently add scope/continuation beyond the frozen contract semantics (e.g. CJ-04 continuation_scope=NONE rule, CJ-05 declared-natural-end truthfulness)
  - id: gate-instrumentation
    must_prove:
      - G0 and G1a-G1d (PRD §32) have metric definitions (correct completion, active user time, manual actions, recovery effort, false-success rate) and PASS-rule evaluators consuming recorded evidence
      - evaluators return FAIL/INSUFFICIENT_EVIDENCE rather than PASS when required confirmation evidence is missing
      - all gate results on the exact T003 candidate remain NOT_RUN; no PASS/FAIL claim for real gates is produced here

