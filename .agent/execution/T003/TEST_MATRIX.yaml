completion_rule: >-
  T003 concern Validation may PASS only on an exact implementation candidate where all required suites,
  the C01-C34 oracle-corpus loading with canonical-bound expectations, negative harness cases, and
  baseline pre-registration enforcement are executable and pass, with every gate result remaining NOT_RUN.
  This JIT Prep creates no PASS evidence.
