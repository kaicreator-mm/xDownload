# required_suites sourced verbatim from the frozen Validation scope
# (Issue #23 / TASK_PACKS.json T004 entry): "Contract compatibility,
# malformed/oversized input rejection, peer authorization and transport
# restart", extended only with the Frozen Task Pack acceptance items
# (idempotent request IDs; restart/reconnect behavior; surfaces as clients
# without owning Core lifetime) and the projection-read rule from frozen
# L2 §6.7/§10.

required_suites:
  - id: wire-contract-compatibility
    must_prove:
      - command/query envelope carries an explicit supported schema identity/version at the wire boundary
      - known compatible envelope versions decode deterministically
      - unknown or incompatible envelope versions fail closed rather than silently reinterpret fields
      - envelope carries the L2 §6.3 command transaction facts needed at the seam (command/idempotency identity, expected/current revision, command type/payload, lineage correlation references)
      - payloads decode into canonical @xdownload/domain-contracts values through the existing fail-closed decoders, with no second decoder vocabulary introduced
  - id: malformed-and-oversized-input-rejection
    must_prove:
      - malformed envelope (missing required field, unknown command discriminant, corrupt framing) rejects before any authority transition
      - payload exceeding declared size bounds rejects without being parsed into authority state
      - declared bounds (size/depth/field limits) are explicit, enforced and tested, per frozen L2 §12 schema/size-bound control
      - rejection diagnostics are typed and leak no secret material
  - id: peer-authorization
    must_prove:
      - same-install/same-user authorized peer can submit commands and read projections
      - peer failing identity or authorization verification is rejected fail-closed from all authority-affecting commands
      - no anonymous/unrestricted fallback transport path coexists with the authorized one; Native Messaging allowed_origins remains a separate platform boundary not bypassed (frozen L2 §6.4/§12, invariant 14)
      - authorization decisions apply per command/query, not once per process lifetime in a way a later peer could inherit
  - id: idempotent-commands-and-duplicate-submit
    must_prove:
      - duplicate submission of the same idempotent command identity converges to the same accepted command/effect lineage and does not silently create another acquisition (frozen L2 §6.8)
      - same idempotency identity with a different payload rejects instead of silently deduplicating or re-executing
      - expected/current revision mismatch rejects with a typed diagnostic
      - accepted command state after restart remains authoritative; replay does not re-execute accepted external effects (ADR-010 idempotent acceptance/reconciliation)
  - id: transport-restart-and-lifecycle-independence
    must_prove:
      - client submit survives Core process restart; after restart the client reconnects and re-submits with the same identity without duplicating effects
      - late command arriving after a lineage is terminal is recorded/rejected as late and never rewrites terminal truth (frozen L2 §11)
      - CLI/browser/Desktop-shaped clients can submit and read through the seam without owning Core lifetime (frozen L2 §9 architecture-driving facts)
      - cancellation/retry commands from different surfaces resolve through the same Core transition with one precedence (frozen L2 §11.1 rule 7)
  - id: projection-read-side
    must_prove:
      - surfaces read Core-owned projections through the seam; no per-surface status derivation (frozen L2 §6.7)
      - read side returns read-only canonical values; no surface-owned budget/result state is creatable via commands (frozen Task Pack forbidden scope)
      - projection responses are subject to the same envelope version/bounds/authorization rules as commands

counterexample_oracles:
  - id: C08
    scenario: page-range-1-3-with-iframe-loadmore-detail-no-continuation
    t004_oracle: a command attempting additional continuation for a contract whose continuation_scope is NONE rejects; load-more requires successor contract/snapshot identity, never a plain command
  - id: C11
    scenario: collection-changes-after-preview
    t004_oracle: no command can mutate a confirmed snapshot through the seam; refresh/re-enumeration commands require successor identity and are otherwise rejected
  - id: C12
    scenario: retry-failed-items
    t004_oracle: a retry command's authority domain is the original failed member identities; a retry command naming replacement/new members rejects
  - id: C13
    scenario: restart-repair-ui-cli-concurrency
    t004_oracle: two clients submitting the same logical command/effect converge to one lineage with inherited remaining budgets; duplicate allocation through the seam rejects
  - id: C16
    scenario: simple-task-forced-through-unnecessary-preview
    t004_oracle: the seam admits single-resource commands without requiring collection-shaped command fields; the envelope does not force collection-only payloads
  - id: C30
    scenario: fifty-item-confirmations-vs-batch-selection
    t004_oracle: one command may carry a batch selection claim set; the seam must not require per-item authority commands to express a single batch claim
  - id: C31
    scenario: prior-12-of-18-selection-reused-on-different-page
    t004_oracle: a command replaying another task's selection/authorization payload cannot inherit its authority; cross-task command replay rejects without validated distinct provenance

