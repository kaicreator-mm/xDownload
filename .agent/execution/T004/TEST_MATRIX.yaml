  - missing-idempotency-identity
  - missing-expected-revision
  - oversized-payload-over-declared-bounds
  - unauthorized-peer-identity
  - peer-authorization-absent-for-authority-command
  - duplicate-idempotency-key-with-different-payload
  - revision-mismatch-command
  - scope-mutating-command-without-successor-identity
