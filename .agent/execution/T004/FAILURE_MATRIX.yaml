task_id: T004
base_sha: c813d3a1f2afea7bd3f99de1d01321904f5fbdd5
status: specification-only-not-run-by-jit-prep

failures:
  - id: task-pack-defect
    trigger: Frozen T004 Task Pack is incomplete or contradicts higher Product/Task-DAG authority
    classification: TASK_PACK_DEFECT
    required_action:
      - stop affected implementation path
      - publish durable evidence to the owning authority
      - do not redesign Product/Task scope locally
    false_pass_forbidden: true

  - id: architecture-contradiction
    trigger: satisfying T004 would require violating Frozen L2 ownership, authority or trust boundaries (e.g. a transport that cannot authorize local peers, or a required unrestricted fallback IPC path)
    classification: ARCHITECTURE_CONTRADICTION
    required_action:
      - stop affected implementation path
      - route through ADS Architecture Amendment/new-material-UNKNOWN process
      - do not weaken invariants in code or tests
    false_pass_forbidden: true

  - id: execution-pack-invalid
    trigger: wrong task/base/branch/task-pack/ADS pin, missing or duplicate core artifact, or pack contradicts higher authority
    classification: EXECUTION_PACK_INVALID
    required_action:
      - stop before implementation
      - regenerate or repair pack through an authorized JIT-prep action
    false_pass_forbidden: true

  - id: dependency-or-base-drift
    trigger: version/v0.1.0 no longer equals manifest base or T002 completion identity is no longer current
    classification: PACK_STALE_MATERIAL_OR_REBIND_REQUIRED
    required_action:
      - re-read integration delta and dependency identities
      - classify under EXECUTION_PACK_STANDARD fail-closed rules
      - never silently rewrite base_sha
      - regenerate on material or unknown drift
    false_pass_forbidden: true

  - id: authority-bypass-of-command-channel
    trigger: client or Core-side code mutates authoritative state (contracts, snapshots, budgets, cancellation order, results) outside the Core-owned command/query seam
    classification: AUTHORITY_BOUNDARY_REJECTED
    required_action:
      - reject the design; route all authority transitions through the seam
      - preserve one mutable authority per frozen L2 §6.1/ADR-001
      - never add a second writer path for convenience
    false_pass_forbidden: true

  - id: unauthorized-peer-accepted
    trigger: a peer without verified same-install/same-user authorization is admitted to an authority-affecting command or query
    classification: SECURITY_BOUNDARY_REJECTED
    required_action:
      - fail closed with typed rejection
      - treat admission evidence as invalid; re-verify the authorization decision path
      - never widen peer scope to make a failing test pass
    false_pass_forbidden: true

  - id: unrestricted-fallback-ipc
    trigger: an unauthenticated fallback transport is provided, or a rejected authorized path silently degrades to an unrestricted local channel bypassing Native Messaging allowed_origins
    classification: SECURITY_BOUNDARY_REJECTED
    required_action:
      - remove/forbid the fallback path
      - truthfully report authorization/transport failure instead of widening authority
    false_pass_forbidden: true

  - id: input-bounds-not-enforced
    trigger: oversized, malformed or deeply nested input is processed, or bounds are declared but not enforced before authority transition
    classification: SEAM_INPUT_REJECTED
    required_action:
      - enforce declared schema/size bounds before decode into authority state
      - return typed diagnostics without secret leakage
      - record exact violation for diagnostics
    false_pass_forbidden: true

  - id: wire-incompatibility-silently-accepted
    trigger: unknown or incompatible envelope schema/version, or unknown authority-changing field, is reinterpreted as a known default
    classification: WIRE_INCOMPATIBILITY_REJECTED
    required_action:
      - fail closed with typed version/field incompatibility
      - preserve original bytes/value for diagnostics where safe
      - never coerce into current semantics without an explicit supported migration
    false_pass_forbidden: true

  - id: idempotency-violation
    trigger: duplicate submit creates another acquisition/effect, or same idempotency identity with a different payload is silently deduplicated/re-executed
    classification: IDEMPOTENCY_VIOLATION_REJECTED
    required_action:
      - converge duplicates on one accepted lineage per frozen L2 §6.8/ADR-010
      - reject conflicting-payload duplicates with typed diagnostics
      - never report exactly-once semantics; only idempotent acceptance/reconciliation
    false_pass_forbidden: true

  - id: surface-authority-leak
    trigger: a surface gains budget/result state ownership, per-surface status derivation, or surface-local cancellation/retry precedence through the seam
    classification: SURFACE_AUTHORITY_REJECTED
    required_action:
      - keep projections read-only and Core-owned
      - resolve all control transitions through one Core order (frozen L2 §11.1 rule 7)
    false_pass_forbidden: true

  - id: secret-export-through-seam
    trigger: command/query payload or projection carries raw reusable cookie/token/password/signed-URL secret material as ordinary state
    classification: AUTHORITY_BOUNDARY_REJECTED
    required_action:
      - reject/redesign within existing opaque AuthorizationContextRef boundary
      - escalate if Frozen Product/L2 semantics cannot be satisfied without secret persistence
    false_pass_forbidden: true

  - id: lifecycle-coupling-introduced
    trigger: client behavior requires owning/keeping Core alive, or Core restart duplicates/replays accepted commands as new external effects
    classification: LIFETIME_COUPLING_REJECTED
    required_action:
      - restore lifecycle-independent client semantics (submit/reconnect/re-submit with same identity)
      - preserve idempotent acceptance across restart per frozen L2 §11
    false_pass_forbidden: true

  - id: incomplete-oracle-mapping
    trigger: any applicable C08/C11/C12/C13/C16/C30/C31 Product counterexample lacks a seam-level T004 representation or negative/positive test oracle
    classification: T004_VALIDATION_INCOMPLETE
    required_action:
      - keep concern Validation non-PASS
      - add bounded seam-level representation/test only
      - do not implement downstream product behavior to close the gap
    false_pass_forbidden: true

  - id: test-tooling-failure
    trigger: install/typecheck/lint/unit/seam test cannot execute, crashes, times out, or has unavailable required tooling
    classification: VALIDATION_NOT_EXECUTED
    required_action:
      - record exact command/environment/failure
      - distinguish infrastructure/tooling failure from product failure
      - never report PASS from an unexecuted or partial gate
    false_pass_forbidden: true

  - id: new-dependency-license-unknown
    trigger: Builder proposes a runtime transport/validation dependency without exact version and license/provenance verification
    classification: EXECUTION_EVIDENCE_INCOMPLETE
    required_action:
      - do not treat dependency choice as accepted
      - record exact package/version/license and primary source before merge candidate qualification
      - keep choice within F1 and Frozen Architecture
    false_pass_forbidden: true
