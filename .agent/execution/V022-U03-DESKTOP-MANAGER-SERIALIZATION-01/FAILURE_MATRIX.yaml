task_id: "v022-U03-DESKTOP-MANAGER-SERIALIZATION-01"
failures:
  - id: "F-WRITESET"
    trigger: "A required change falls outside manager.ts and manager.test.ts."
    disposition: "STOP; TASK_PACK_DEFECT or scope amendment; no out-of-scope write."
  - id: "F-CLAIM"
    trigger: "Missing, stale, duplicate or ambiguous Builder Claim."
    disposition: "STOP; no source mutation; re-read canonical GitHub facts."
  - id: "F-BASE"
    trigger: "WIP integration HEAD differs from the exact base before source execution."
    disposition: "BLOCKED; rebind/regenerate only through an authorized Controller; do not write on stale base."
  - id: "F-QUEUE"
    trigger: "An operation rejects or throws while holding the manager gate."
    disposition: "Release the gate in finally; preserve original error/refusal; verify later work proceeds."
  - id: "F-REENTRANT"
    trigger: "A gated method calls public list() and re-enters the same queue."
    disposition: "Use the private unlocked list helper; no nested wait/deadlock."
  - id: "F-CROSS-LINEAGE"
    trigger: "Deferred projection completion changes ambient adapter lineage during a user control."
    disposition: "Serialize all manager adapter operations; command target must remain the requested lineage."
  - id: "F-CI"
    trigger: "Syntax/Prettier/typecheck/test/Woodpecker failure."
    disposition: "Preserve first failure and exact SHA; repair only inside the frozen two-path write set; retry as a new immutable attempt."
  - id: "F-REVIEW"
    trigger: "Independent Exact-SHA review finds P0/P1 or material P2."
    disposition: "Changes requested; preserve findings; do not merge WIP integration."
