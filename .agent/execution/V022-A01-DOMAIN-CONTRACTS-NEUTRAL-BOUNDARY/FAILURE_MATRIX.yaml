task_id: "V022-A01-DOMAIN-CONTRACTS-NEUTRAL-BOUNDARY"
failures:
  - id: "F-BASE"
    trigger: "Current WIP HEAD/tree differs from the accepted Task Pack and Execution Pack base."
    disposition: "STOP before source mutation; request exact-base rebind and regenerate the Execution Pack."
  - id: "F-WRITESET"
    trigger: "Any change is needed outside the three frozen neutral-contract paths."
    disposition: "STOP; no out-of-scope write; request a separate Owner-approved Task."
  - id: "F-POLICY-MOVE"
    trigger: "A shared type candidate includes Business Intent, K/S/B/C, route-table, BUILD or Workflow policy."
    disposition: "Keep it in Domain App; do not move it into generic Contracts."
  - id: "F-DUPLICATE-VALIDATOR"
    trigger: "App and Host require divergent copies of the same Host DTO validator."
    disposition: "STOP and redesign the neutral contract so App projects to it and Host independently validates it."
  - id: "F-IO-IMPORT"
    trigger: "A neutral Contracts file imports App, Host, Core, Node filesystem, network or DomainHarness SDK."
    disposition: "FAIL the architecture gate; Contracts remains pure and I/O-free."
  - id: "F-TERMINAL-WIDENING"
    trigger: "Accepted/running is treated as a terminal EffectEnvelope outcome or evidence escapes the confirmed root."
    disposition: "Reject the implementation and preserve typed terminal/evidence boundaries."
  - id: "F-SDK"
    trigger: "Implementation requires an SDK/ABI, vendor tarball, manifest, lockfile or dependency change."
    disposition: "STOP; separate Owner decision required. Current xDownload vendor pins are 0.10.2-rc.0 and remain unchanged."
  - id: "F-CI"
    trigger: "Syntax, Prettier, focused tests, typecheck, ci:verify or Woodpecker fails."
    disposition: "Preserve the first failure and exact SHA; repair only inside the frozen write set; rerun the required checks after syntax PASS."
