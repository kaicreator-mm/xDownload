task_id: T002
base_sha: 72b04774592265953671f7203d5ca0687da5b033
status: specification-only-not-run-by-jit-prep

failures:
  - id: task-pack-defect
    trigger: Frozen T002 Task Pack is incomplete or contradicts higher Product/Task-DAG authority
    classification: TASK_PACK_DEFECT
    required_action:
      - stop affected implementation path
      - publish durable evidence to the owning authority
      - do not redesign Product/Task scope locally
    false_pass_forbidden: true

  - id: architecture-contradiction
    trigger: satisfying T002 would require violating Frozen L2 ownership, authority or trust boundaries
    classification: ARCHITECTURE_CONTRADICTION
    required_action:
      - stop affected implementation path
      - route through ADS Architecture Amendment/new-material-UNKNOWN process
      - do not weaken invariants in code or tests
    false_pass_forbidden: true

  - id: execution-pack-invalid
    trigger: wrong task/base/branch/task-pack/ADS pin, missing or duplicate core artifact, or pack contradicts higher authority
    classification: EXECUTION_PACK_INVALID
    required_action:
      - stop before implementation
      - regenerate or repair pack through an authorized JIT-prep action
    false_pass_forbidden: true

  - id: dependency-or-base-drift
    trigger: version/v0.1.0 no longer equals manifest base or T001 completion identity is no longer current
    classification: PACK_STALE_MATERIAL_OR_REBIND_REQUIRED
    required_action:
      - re-read integration delta and dependency identities
      - classify under EXECUTION_PACK_STANDARD fail-closed rules
      - never silently rewrite base_sha
      - regenerate on material or unknown drift
    false_pass_forbidden: true

  - id: incompatible-schema-version
    trigger: input declares unsupported or semantically incompatible contract/schema version
    classification: DOMAIN_SCHEMA_REJECTED
    required_action:
      - fail closed with typed version incompatibility
      - preserve original bytes/value for diagnostics where safe
      - never coerce into current semantics without an explicit supported migration
    false_pass_forbidden: true

  - id: malformed-canonical-value
    trigger: missing required field, invalid enum/discriminant, malformed identifier, malformed scope/budget/result value, or unknown authority-changing field
    classification: DOMAIN_SCHEMA_REJECTED
    required_action:
      - reject before constructing an authoritative canonical value
      - return typed validation diagnostics without secret leakage
    false_pass_forbidden: true

  - id: invalid-domain-state
    trigger: value is structurally decodable but violates Product semantic invariants or legal result combinations
    classification: DOMAIN_INVARIANT_REJECTED
    required_action:
      - reject deterministically
      - identify violated invariant/oracle
      - do not normalize an invalid state into success
    false_pass_forbidden: true

  - id: membership-drift
    trigger: snapshot member identity set changes or count equality hides replacement/duplication
    classification: SNAPSHOT_DRIFT_REJECTED
    required_action:
      - retain original snapshot identity
      - require successor contract/snapshot when re-enumeration is authorized
      - never silently replace members
    false_pass_forbidden: true

  - id: scope-mutation
    trigger: budget, authorization or later continuation request changes confirmed requested_scope without successor identity
    classification: SCOPE_MUTATION_REJECTED
    required_action:
      - reject mutation
      - require explicit successor contract/snapshot where Product authority permits change
    false_pass_forbidden: true

  - id: incomplete-oracle-mapping
    trigger: any C01-C34 Product counterexample lacks a contract-level T002 representation or negative/positive test oracle
    classification: T002_VALIDATION_INCOMPLETE
    required_action:
      - keep concern Validation non-PASS
      - add bounded contract-level representation/test only
      - do not implement downstream product behavior to close the gap
    false_pass_forbidden: true

  - id: test-tooling-failure
    trigger: install/typecheck/lint/unit/contract test cannot execute, crashes, times out, or has unavailable required tooling
    classification: VALIDATION_NOT_EXECUTED
    required_action:
      - record exact command/environment/failure
      - distinguish infrastructure/tooling failure from product failure
      - never report PASS from an unexecuted or partial gate
    false_pass_forbidden: true

  - id: new-dependency-license-unknown
    trigger: Builder proposes a runtime schema/validation dependency without exact version and license/provenance verification
    classification: EXECUTION_EVIDENCE_INCOMPLETE
    required_action:
      - do not treat dependency choice as accepted
      - record exact package/version/license and primary source before merge candidate qualification
      - keep choice within F1 and Frozen Architecture
    false_pass_forbidden: true

  - id: raw-secret-in-contract
    trigger: canonical public/domain value contains reusable cookie token password signed-URL secret or equivalent raw credential material as ordinary state
    classification: AUTHORITY_BOUNDARY_REJECTED
    required_action:
      - reject/redesign within existing opaque AuthorizationContextRef boundary
      - escalate if Frozen Product/L2 semantics cannot be satisfied without secret persistence
    false_pass_forbidden: true
