  - duplicate-logical-identity-with-conflicting-semantics
  - membership-count-equal-identity-set-different
  - continuation-added-after-confirmation-without-successor
  - budget-used-as-scope
  - auth-context-used-to-rewrite-requested-scope
  - invalid-result-status-combination
  - verified-complete-without-closure-evidence
  - selected-complete-with-failed-required-validation
  - raw-secret-field-in-canonical-public-contract

completion_rule: >-
  T002 concern Validation may PASS only on an exact implementation candidate where all required suites,
  the C01-C34 contract-level oracle representation, and required negative cases are executable and pass.
  This JIT Prep creates no PASS evidence.
