task_id: T008
base_sha: c813d3a1f2afea7bd3f99de1d01321904f5fbdd5
status: specification-only-not-run-by-jit-prep

failures:
  - id: task-pack-defect
    trigger: Frozen T008 Task Pack is incomplete or contradicts higher Product/Task-DAG authority
    classification: TASK_PACK_DEFECT
    required_action:
      - stop affected implementation path
      - publish durable evidence to the owning authority
      - do not redesign Product/Task scope locally
    false_pass_forbidden: true

  - id: architecture-contradiction
    trigger: satisfying T008 would require violating Frozen L2 ownership, authority or trust boundaries
    classification: ARCHITECTURE_CONTRADICTION
    required_action:
      - stop affected implementation path
      - route through ADS Architecture Amendment/new-material-UNKNOWN process
      - do not weaken invariants in code or tests
    false_pass_forbidden: true

  - id: execution-pack-invalid
    trigger: wrong task/base/branch/task-pack/ADS pin, missing or duplicate core artifact, or pack contradicts higher authority
    classification: EXECUTION_PACK_INVALID
    required_action:
      - stop before implementation
      - regenerate or repair pack through an authorized JIT-prep action
    false_pass_forbidden: true

  - id: dependency-or-base-drift
    trigger: version/v0.1.0 no longer equals manifest base or T002 completion identity is no longer current
    classification: PACK_STALE_MATERIAL_OR_REBIND_REQUIRED
    required_action:
      - re-read integration delta and dependency identities
      - classify under EXECUTION_PACK_STANDARD fail-closed rules
      - never silently rewrite base_sha
      - regenerate on material or unknown drift
    false_pass_forbidden: true

  - id: unsafe-resume-append
    trigger: partial bytes are appended without sufficiently validated representation identity (missing/incompatible/changed strong validator, If-Range mismatch)
    classification: UNSAFE_RESUME_REJECTED
    required_action:
      - fail closed or restart from zero on the same logical target/effect lineage
      - record typed evidence of the identity decision
      - never normalize an unproven append into success
    false_pass_forbidden: true

  - id: locator-target-substitution
    trigger: redirect/CDN/signed-locator change is treated as permission to replace the frozen logical target, or a locator change cannot be provenance-bound and is silently followed
    classification: TARGET_SUBSTITUTION_REJECTED
    required_action:
      - fail closed on unsupported/ambiguous identity
      - preserve original frozen target identity in evidence
      - never substitute a target because a locator changed
    false_pass_forbidden: true

  - id: redirect-scope-expansion
    trigger: redirect/CDN chain, refreshed signed locator or follow-on fetch enlarges requested scope or membership beyond the frozen target
    classification: SCOPE_EXPANSION_REJECTED
    required_action:
      - restrict redirect following to serving the frozen single target
      - reject/refuse acquisition paths that imply discovery expansion
      - record truthful truncated/failed result vocabulary
    false_pass_forbidden: true

  - id: integrity-gate-bypass
    trigger: bytes are accepted/projected complete without required Transfer/Format/Target (and S3 Media) validation, including truncated, corrupt or wrong-target bytes
    classification: VALIDATION_BYPASS_REJECTED
    required_action:
      - keep acceptance gated on applicable validation layers (Frozen PRD 22)
      - project truthful failure/truncation vocabulary
      - never report an unexecuted validation gate as PASS
    false_pass_forbidden: true

  - id: budget-boundary-violation
    trigger: transfer/retry consumes budget through a private adapter ledger, skips counting, treats retry as replenishment, or ignores GlobalSafetyBudget precedence
    classification: BUDGET_BOUNDARY_VIOLATED
    required_action:
      - consume budget only through the authoritative canonical seam
      - inherit remaining budgets on retry/restart
      - stop work truthfully on exhaustion without redefining scope
    false_pass_forbidden: true

  - id: retry-lineage-escape
    trigger: retry/restart creates new/replacement target or membership identity instead of staying in the original failed lineage
    classification: RETRY_LINEAGE_REJECTED
    required_action:
      - bind retry to the original frozen target/effect identity
      - require successor contract/snapshot identity for any authorized scope change
      - never admit new targets through retry
    false_pass_forbidden: true

  - id: uncontrolled-network-fixture
    trigger: concern tests depend on real third-party network hosts, non-deterministic external responses, or fixtures outside the task-owned controlled protocol server
    classification: TEST_FIXTURE_INVALID
    required_action:
      - keep all T008 concern tests on deterministic localhost controlled fixtures
      - record environment dependence as a blocker rather than a PASS
    false_pass_forbidden: true

  - id: test-tooling-failure
    trigger: install/typecheck/lint/unit/protocol test cannot execute, crashes, times out, or has unavailable required tooling
    classification: VALIDATION_NOT_EXECUTED
    required_action:
      - record exact command/environment/failure
      - distinguish infrastructure/tooling failure from product failure
      - never report PASS from an unexecuted or partial gate
    false_pass_forbidden: true

  - id: new-dependency-license-unknown
    trigger: Builder proposes a runtime HTTP/client dependency without exact version and license/provenance verification
    classification: EXECUTION_EVIDENCE_INCOMPLETE
    required_action:
      - do not treat dependency choice as accepted
      - record exact package/version/license and primary source before merge candidate qualification
      - keep choice within F1 and Frozen Architecture
    false_pass_forbidden: true

  - id: raw-secret-in-adapter-state
    trigger: signed-URL credentials/tokens/cookies are persisted as ordinary adapter/canonical state instead of opaque authorization references
    classification: AUTHORITY_BOUNDARY_REJECTED
    required_action:
      - keep locator/authorization secrets out of durable canonical state (opaque AuthorizationContextRef boundary)
      - escalate if Frozen Product/L2 semantics cannot be satisfied without secret persistence
    false_pass_forbidden: true
