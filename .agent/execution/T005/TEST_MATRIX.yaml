completion_rule: >-
  T005 concern Validation may PASS only on an exact implementation candidate where all required suites,
  the R01-R12 recovery/durability oracles, the PRD cross-referenced counterexamples and required negative
  cases are executable on a real local SQLite/filesystem host and pass. Claims are bounded to the actually
  exercised process-death/reopen tuple; broader durability remains unproven per the Frozen Task Pack.
  This JIT Prep creates no PASS evidence.
