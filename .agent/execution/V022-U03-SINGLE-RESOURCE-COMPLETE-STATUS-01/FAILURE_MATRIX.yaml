  - id: "F-REBASE"
    trigger: "The rebased candidate changes paths outside the two frozen files or does not preserve the original implementation behavior."
    disposition: "STOP; do not push or open a PR; report exact diff and request Owner amendment."
  - id: "F-WRITESET"
    trigger: "A required change falls outside renderer-main.ts and ux-r0-form-schema.test.ts."
