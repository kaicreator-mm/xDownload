  - id: "F-SEMANTICS"
    trigger: "A proposed rule treats NOT_APPLICABLE as generic success without the remaining authoritative terminal dimensions."
    disposition: "Reject; require all completion dimensions and a present TERMINAL projection."
  - id: "F-CONTRACT"
    trigger: "A proposal changes the domain contract to permit VERIFIED_COMPLETE for single-resource."
    disposition: "STOP; forbidden by this Task."
  - id: "F-UI-CLAIM"
    trigger: "UI says verified coverage when coverage is NOT_APPLICABLE."
    disposition: "Fail review; display completed without claiming coverage was measured."
  - id: "F-CI"
    trigger: "Syntax, Prettier, typecheck, focused test, aggregate CI or Woodpecker failure."
    disposition: "Preserve exact SHA and first failure; repair only inside frozen write set."
