name: xd163 temporary Prettier format
on:
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/cli/src/main.ts apps/cli/test/pipe-target.test.ts
          echo XD163_0_START
          cat apps/cli/src/main.ts
          echo XD163_0_END
          echo XD163_1_START
          cat apps/cli/test/pipe-target.test.ts
          echo XD163_1_END
