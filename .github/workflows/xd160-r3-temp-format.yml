name: xd160 R3 temporary exact formatter
on:
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write packages/core-runtime/src/flow.ts
          echo XD160_R3_START
          cat packages/core-runtime/src/flow.ts
          echo XD160_R3_END
