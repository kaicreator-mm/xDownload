name: xDownload Win32 full-machine SID lookup R2
on:
  push:
    branches:
      - integration/xd-v010-pr143-os-sid-probe
jobs:
  native-sid:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Installed dependency closure
        run: pnpm install --frozen-lockfile
      - name: Run exact Windows SID helper oracle
        run: pnpm exec vitest run packages/core-seam/test/sddl-local-admin-oracle.test.ts --maxWorkers=1 --testTimeout=15000
