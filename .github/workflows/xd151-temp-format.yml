name: xd151 temporary exact formatter output
on:
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  exact-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write packages/browser-collection-workflow/test/s5-confirmed-core-flow.test.ts
          echo XD151_FORMAT_BEGIN
          cat packages/browser-collection-workflow/test/s5-confirmed-core-flow.test.ts
          echo XD151_FORMAT_END
