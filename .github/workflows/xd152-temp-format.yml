name: xd152 temporary formatter diagnostic
on:
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier output for authorized files
        run: |
          pnpm exec prettier --write apps/browser-extension/src/background/s5-group-intent.ts apps/browser-extension/src/background/service-worker.ts apps/browser-extension/src/popup/popup.html apps/browser-extension/test/popup-s5-admission.test.ts apps/browser-extension/test/s5-group-intent.test.ts
          echo XD152_FILE0_BEGIN
          cat apps/browser-extension/src/background/s5-group-intent.ts
          echo XD152_FILE0_END
          echo XD152_FILE1_BEGIN
          cat apps/browser-extension/src/background/service-worker.ts
          echo XD152_FILE1_END
          echo XD152_FILE2_BEGIN
          cat apps/browser-extension/src/popup/popup.html
          echo XD152_FILE2_END
          echo XD152_FILE3_BEGIN
          cat apps/browser-extension/test/popup-s5-admission.test.ts
          echo XD152_FILE3_END
          echo XD152_FILE4_BEGIN
          cat apps/browser-extension/test/s5-group-intent.test.ts
          echo XD152_FILE4_END
