name: xd149 R2 formatter diagnostic
on:
  push:
    branches:
      - work/v010-149-pinned-https-manifest
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write packages/hls-vod-adapter/src/pinned-https-manifest.ts packages/hls-vod-adapter/test/pinned-https-manifest.test.ts
          echo XD149R2_SRC_BEGIN
          cat packages/hls-vod-adapter/src/pinned-https-manifest.ts
          echo XD149R2_SRC_END
          echo XD149R2_TEST_BEGIN
          cat packages/hls-vod-adapter/test/pinned-https-manifest.test.ts
          echo XD149R2_TEST_END
