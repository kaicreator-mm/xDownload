name: xd148 temporary formatter diagnostic
on:
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output for S4 wire test
        run: |
          pnpm exec prettier --write packages/core-seam/test/s4-closed-wire-admission.test.ts
          echo XD148_START
          cat packages/core-seam/test/s4-closed-wire-admission.test.ts
          echo XD148_END
