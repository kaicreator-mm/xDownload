name: xd164 r2 exact formatter (temporary)
on:
  pull_request:
    branches: [version/v0.1.0]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write build/test/core-host-bind-before-runtime.test.ts
          echo XD164R2_START
          cat build/test/core-host-bind-before-runtime.test.ts
          echo XD164R2_END
