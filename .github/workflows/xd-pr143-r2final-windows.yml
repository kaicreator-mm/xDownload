name: xDownload PR143 R2 final real Windows security
on:
  push:
    branches:
      - integration/xd-v010-pr143-r2final-windows
jobs:
  windows-native-security:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pin physical runner identity
        shell: pwsh
        run: |
          git rev-parse HEAD
          whoami /user
          node --version
          pnpm --version
      - name: Install exact frozen dependency closure
        run: pnpm install --frozen-lockfile
      - name: Check local Administrator identity using Windows OS evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $all = @(Get-CimInstance -ClassName Win32_UserAccount -Filter 'LocalAccount = TRUE' -ErrorAction Stop)
          $admins = @($all | Where-Object { $_.SID -like '*-500' })
          $local = @(Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' })
          $actual = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Write-Host ('CIM local account count: ' + $all.Count)
          Write-Host ('CIM local admin SID count: ' + $admins.Count)
          Write-Host ('Get-LocalUser local admin SID count: ' + $local.Count)
          Write-Host ('Token equals CIM local admin: ' + ($admins.Count -eq 1 -and $admins[0].SID -eq $actual))
          Write-Host ('Token equals Get-LocalUser local admin: ' + ($local.Count -eq 1 -and $local[0].SID.Value -eq $actual))
      - name: Native OS tests in isolation with explicit long GC budget
        run: pnpm exec vitest run packages/core-seam/test/sddl-local-admin-oracle.test.ts packages/core-seam/test/transport-windows-pipe.test.ts packages/core-seam/test/win-ipc-native.test.ts --maxWorkers=1 --testTimeout=30000
