name: xDownload PR143 final Windows local Administrator SID
on:
  push:
    branches:
      - integration/xd-v010-pr143-r2-sid-final
jobs:
  sid-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify full local machine SID against domain RID500 negatives
        run: pnpm exec vitest run packages/core-seam/test/sddl-local-admin-oracle.test.ts --maxWorkers=1 --testTimeout=20000
