name: xDownload v0.1 WinIPC combined candidate test
on:
  push:
    branches:
      - integration/xd-v010-winipc-df43-base-bf066a
jobs:
  windows-combined:
    name: Node24 real Windows combined sources
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned combined branch HEAD
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node24 from repository
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record combined identity
        shell: pwsh
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version
          git status --short
      - name: Install without frozen lockfile changes
        run: pnpm install --frozen-lockfile
      - name: Run aggregate checks including real Windows native suites
        run: pnpm ci:verify
      - name: Rebuild combined 4 artifacts and package audit
        run: pnpm build
      - name: Run installed artifact smoke
        run: pnpm smoke
