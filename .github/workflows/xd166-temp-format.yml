name: xd166 temporary pinned formatter
on:
  pull_request:
    branches: [version/v0.1.0]
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write build/core-host.ts build/test/core-host-winpipe.test.ts
          echo XD166_0_START
          cat build/core-host.ts
          echo XD166_0_END
          echo XD166_1_START
          cat build/test/core-host-winpipe.test.ts
          echo XD166_1_END
