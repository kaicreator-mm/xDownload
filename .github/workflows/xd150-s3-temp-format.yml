name: xd150 S3 temp formatter diagnostic
on:
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write packages/core-seam/src/envelope.ts packages/core-seam/src/s3-seam12-payload.ts packages/core-seam/test/s3-closed-wire-admission.test.ts packages/core-seam/test/s4-closed-wire-admission.test.ts
          echo XD150S3_0_START
          cat packages/core-seam/src/envelope.ts
          echo XD150S3_0_END
          echo XD150S3_1_START
          cat packages/core-seam/src/s3-seam12-payload.ts
          echo XD150S3_1_END
          echo XD150S3_2_START
          cat packages/core-seam/test/s3-closed-wire-admission.test.ts
          echo XD150S3_2_END
          echo XD150S3_3_START
          cat packages/core-seam/test/s4-closed-wire-admission.test.ts
          echo XD150S3_3_END
