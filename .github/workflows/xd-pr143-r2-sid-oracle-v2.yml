name: xDownload PR143 R2 exact Windows local admin SID oracle
on:
  push:
    branches:
      - integration/xd-v010-pr143-sid-oracle-v2
jobs:
  os-sid:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Full-machine SID equality and domain RID500 negatives
        run: pnpm exec vitest run packages/core-seam/test/sddl-local-admin-oracle.test.ts --maxWorkers=1 --testTimeout=30000
