name: xDownload PR146 native SDDL extent real Windows
on:
  push:
    branches:
      - integration/xd-v010-pr146-windows-sddl-read
jobs:
  real-sddl:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Exact SDDL native bounded-read stress
        run: pnpm exec vitest run packages/core-seam/test/win-ipc-native.test.ts --maxWorkers=1 --testTimeout=30000 -t "keeps OS handle count flat"
