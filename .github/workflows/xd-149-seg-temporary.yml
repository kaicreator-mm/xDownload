name: xd149 segment temporary format
on:
  push:
    branches:
      - work/v010-149-pinned-https-segments
  pull_request:
    branches:
      - version/v0.1.0
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write packages/hls-vod-adapter/src/pinned-https-segment.ts packages/hls-vod-adapter/test/pinned-https-segment.test.ts
          echo XD149_SEG_SRC_BEGIN
          cat packages/hls-vod-adapter/src/pinned-https-segment.ts
          echo XD149_SEG_SRC_END
          echo XD149_SEG_TEST_BEGIN
          cat packages/hls-vod-adapter/test/pinned-https-segment.test.ts
          echo XD149_SEG_TEST_END
